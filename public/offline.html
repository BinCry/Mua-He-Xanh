<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#922724">
    <title>Kết nối đang gián đoạn | Du Lịch Bình Lợi</title>
    <style>
        :root { --offline-primary: #922724; --offline-primary-dark: #761f1d; --offline-green: #15803d; --offline-surface: #ffffff; --offline-page: #faf9f7; --offline-text: #262321; --offline-muted: #66615d; --offline-border: #ebe4df; --offline-danger-soft: #fdf0ee; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body { min-height: 100vh; min-height: 100dvh; margin: 0; background: var(--offline-page); color: var(--offline-text); font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
        .offline-page { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: clamp(24px, 7vh, 72px) clamp(16px, 4vw, 32px); }
        .offline-shell { width: min(100%, 440px); display: grid; justify-items: center; gap: clamp(20px, 4vh, 32px); text-align: center; }
        .offline-brand { text-wrap: balance; }
        .offline-brand__name { margin: 0; color: var(--offline-primary); font-size: clamp(1.5rem, 4.5vw, 2rem); font-weight: 800; letter-spacing: 0.045em; line-height: 1.15; }
        .offline-brand__tagline { margin: 0.45rem 0 0; color: var(--offline-green); font-family: Georgia, "Times New Roman", serif; font-size: clamp(1rem, 3.5vw, 1.15rem); font-style: italic; font-weight: 700; }
        .connection-card { width: 100%; padding: clamp(24px, 6vw, 40px); background: var(--offline-surface); border: 1px solid var(--offline-border); border-radius: clamp(18px, 4vw, 24px); box-shadow: 0 12px 30px rgba(74, 45, 35, 0.07); }
        .connection-icon { width: clamp(52px, 14vw, 64px); aspect-ratio: 1; display: grid; place-items: center; margin: 0 auto clamp(18px, 3vh, 24px); border-radius: 50%; background: var(--offline-danger-soft); color: var(--offline-primary); }
        .connection-icon svg { width: 55%; height: 55%; }
        .connection-card h1 { margin: 0; font-size: clamp(1.125rem, 3.8vw, 1.375rem); font-weight: 750; letter-spacing: -0.015em; line-height: 1.3; text-wrap: balance; }
        .connection-description { max-width: 34ch; margin: 0.85rem auto 0; color: var(--offline-muted); font-size: clamp(0.875rem, 2.8vw, 1rem); line-height: 1.65; text-wrap: pretty; }
        .retry-status { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin: clamp(18px, 3vh, 24px) 0; color: #766f6a; font-size: 0.875rem; line-height: 1.4; }
        .retry-spinner { width: 1rem; height: 1rem; flex: 0 0 auto; border: 2px solid #e4d8d3; border-top-color: var(--offline-primary); border-radius: 50%; animation: retry-spin 0.85s linear infinite; }
        .retry-button { min-width: 160px; min-height: 48px; padding: 0.75rem 1.35rem; border: 1px solid var(--offline-primary); border-radius: 999px; background: var(--offline-primary); color: #ffffff; cursor: pointer; font: inherit; font-size: 0.95rem; font-weight: 700; line-height: 1.2; transition: background-color 180ms ease, border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease; }
        .retry-button:hover { background: var(--offline-primary-dark); border-color: var(--offline-primary-dark); box-shadow: 0 6px 16px rgba(146, 39, 36, 0.2); }
        .retry-button:active { transform: scale(0.98); }
        .retry-button:focus-visible { outline: 3px solid rgba(146, 39, 36, 0.32); outline-offset: 3px; }
        .clear-cache-button { min-height: 44px; margin: 0.75rem auto 0; padding: 0.45rem 0.75rem; border: 0; background: transparent; color: #766f6a; cursor: pointer; font: inherit; font-size: 0.8125rem; font-weight: 600; text-decoration: underline; text-underline-offset: 0.2em; }
        .clear-cache-button:hover { color: var(--offline-primary-dark); }
        .clear-cache-button:focus-visible { outline: 3px solid rgba(146, 39, 36, 0.32); outline-offset: 2px; border-radius: 0.4rem; }
        @keyframes retry-spin { to { transform: rotate(360deg); } }
        @media (max-height: 600px) { .offline-page { align-items: flex-start; } .offline-shell { gap: 18px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }
    </style>
</head>
<body>
    <main class="offline-page" aria-labelledby="connection-title">
        <div class="offline-shell">
            <header class="offline-brand">
                <p class="offline-brand__name">DU LỊCH BÌNH LỢI</p>
                <p class="offline-brand__tagline">Chạm sắc bản nguyên</p>
            </header>
            <section class="connection-card" role="status" aria-live="polite">
                <div class="connection-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5.2 10.2a10 10 0 0 1 12.6 0"></path><path d="M8.1 13.2a5.9 5.9 0 0 1 5.1-.8"></path><path d="M12 18.2h.01"></path><path d="M3.5 3.5 20.5 20.5"></path>
                    </svg>
                </div>
                <h1 id="connection-title">Kết nối đang gián đoạn</h1>
                <p class="connection-description">Không thể kết nối đến hệ thống. Chúng tôi sẽ tự động thử lại khi kết nối được khôi phục.</p>
                <p class="retry-status"><span class="retry-spinner" aria-hidden="true"></span><span>Đang thử kết nối lại...</span></p>
                <button class="retry-button" type="button" onclick="window.location.reload()">Thử lại ngay</button>
                <button class="clear-cache-button" type="button" onclick="clearAllCacheAndReload()">Xóa bộ nhớ đệm và tải lại</button>
            </section>
        </div>
    </main>
    <script>
        // Preserve the existing automatic retry behavior.
        setInterval(function() {
            fetch('/', { method: 'HEAD', cache: 'no-store', mode: 'no-cors' })
                .then(function(res) { if (res.ok || res.type === 'opaque' || res.status < 500) { window.location.reload(); } })
                .catch(function() {});
        }, 5000);

        // Preserve the existing cache-reset recovery action.
        async function clearAllCacheAndReload() {
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) await registration.unregister();
                }
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (const cacheName of cacheNames) await caches.delete(cacheName);
                }
            } catch (error) {}
            window.location.href = '/?cachebust=' + Date.now();
        }
    </script>
</body>
</html>
